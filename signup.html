<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Storage Boxes</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { warmWhite: '#F9F8F6', cream: '#F3EFEA', sand: '#E6DCCF', taupe: '#9C8F82', charcoal: '#2A2C2A', darkBg: '#1A1C1A', accent: '#C5A880' } }, fontFamily: { sans: ['Outfit', 'sans-serif'], serif: ['Playfair Display', 'serif'] } } } }
    </script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-brand-warmWhite text-brand-charcoal dark:bg-brand-darkBg dark:text-brand-warmWhite font-sans antialiased min-h-screen relative">
    
    <!-- Theme Toggle -->
    <button id="theme-toggle" class="absolute top-6 right-6 md:top-8 md:right-8 text-2xl hover:text-brand-accent transition-colors z-50">
        <i class='bx bx-moon'></i>
    </button>
    <div class="flex min-h-screen w-full items-center justify-center py-12 px-4">
        <!-- Auth Form Card -->
        <div class="w-full max-w-md bg-white dark:bg-brand-charcoal/40 p-8 md:p-10 rounded-2xl shadow-2xl border border-brand-sand/30 dark:border-brand-charcoal/50">
            <div class="w-full mx-auto text-center">
                <a href="index.html" class="font-serif text-3xl font-semibold flex items-center justify-center gap-2 mb-8">
                    <i class='bx bx-box text-brand-accent'></i>BOXED.
                </a>
                
                <h1 class="text-3xl font-serif mb-2">Create Account</h1>
                <p class="text-brand-taupe mb-8">Join us to save wishlists and track orders.</p>

                <form class="space-y-5 text-left">
                    <div>
                        <label class="block text-sm font-medium mb-2">First Name</label>
                        <input type="text" class="w-full bg-transparent border-b border-brand-charcoal/30 dark:border-brand-warmWhite/30 py-2 focus:outline-none focus:border-brand-accent transition-colors" placeholder="Jane">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Last Name</label>
                        <input type="text" class="w-full bg-transparent border-b border-brand-charcoal/30 dark:border-brand-warmWhite/30 py-2 focus:outline-none focus:border-brand-accent transition-colors" placeholder="Doe">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Email Address</label>
                        <input type="email" class="w-full bg-transparent border-b border-brand-charcoal/30 dark:border-brand-warmWhite/30 py-2 focus:outline-none focus:border-brand-accent transition-colors" placeholder="Enter your email">
                    </div>
                    <div class="relative">
                        <label class="block text-sm font-medium mb-2">Password</label>
                        <input type="password" class="w-full bg-transparent border-b border-brand-charcoal/30 dark:border-brand-warmWhite/30 py-2 pr-10 focus:outline-none focus:border-brand-accent transition-colors" placeholder="Create a password">
                        <button type="button" class="absolute right-0 top-8 text-brand-taupe hover:text-brand-accent"><i class='bx bx-show text-xl'></i></button>
                    </div>
                    
                    <div class="py-2">
                        <label class="flex items-start gap-2 text-sm cursor-pointer">
                            <input type="checkbox" class="accent-brand-accent rounded mt-1">
                            <span class="text-brand-taupe text-xs leading-tight">By creating an account, you agree to our <a href="#" class="text-brand-charcoal dark:text-brand-warmWhite underline">Terms & Conditions</a> and <a href="#" class="text-brand-charcoal dark:text-brand-warmWhite underline">Privacy Policy</a>.</span>
                        </label>
                    </div>

                    <button type="button" onclick="window.location.href='dashboard.html'" class="w-full bg-brand-charcoal text-white dark:bg-brand-warmWhite dark:text-brand-charcoal hover:bg-brand-accent dark:hover:bg-brand-accent dark:hover:text-white rounded py-4 transition-colors font-medium">Create Account</button>
                </form>

                <div class="mt-8 flex items-center gap-4">
                    <div class="h-px bg-brand-sand/50 dark:bg-brand-charcoal flex-1"></div>
                    <span class="text-xs text-brand-taupe uppercase tracking-wider">Or continue with</span>
                    <div class="h-px bg-brand-sand/50 dark:bg-brand-charcoal flex-1"></div>
                </div>

                <div class="grid grid-cols-2 gap-4 mt-8">
                    <button class="flex items-center justify-center gap-2 border border-brand-sand/50 dark:border-brand-charcoal py-3 rounded hover:bg-brand-cream dark:hover:bg-brand-charcoal transition-colors">
                        <i class='bx bxl-google text-xl'></i> <span class="text-sm font-medium">Google</span>
                    </button>
                    <button class="flex items-center justify-center gap-2 border border-brand-sand/50 dark:border-brand-charcoal py-3 rounded hover:bg-brand-cream dark:hover:bg-brand-charcoal transition-colors">
                        <i class='bx bxl-apple text-xl'></i> <span class="text-sm font-medium">Apple</span>
                    </button>
                </div>

                <p class="text-center mt-8 text-sm text-brand-taupe">
                    Already have an account? <a href="login.html" class="text-brand-charcoal dark:text-brand-warmWhite font-medium hover:text-brand-accent transition-colors">Sign in</a>
                </p>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
